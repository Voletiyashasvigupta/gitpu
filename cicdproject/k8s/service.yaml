# ============================================================
#  Service — exposes the Deployment inside (and outside) the cluster
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: cicdproject-service
  namespace: default
  labels:
    app: cicdproject
spec:
  selector:
    app: cicdproject          # routes traffic to pods with this label
  ports:
    - name: http
      protocol: TCP
      port: 80                # external port
      targetPort: 8081        # container port
  type: LoadBalancer          # use NodePort if you don't have a cloud LB
                              # use ClusterIP if you'll add an Ingress later

